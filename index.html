<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4a0d1d" />
    <meta name="description" content="Mohamed & Laila — a premium Sudanese wedding invitation inspired by authentic Jertiq tradition, family and modern luxury." />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#260812" />
    <meta property="og:title" content="Mohamed & Laila — Sudanese Jertiq Wedding" />
    <meta property="og:description" content="A luxury digital wedding invitation celebrating Sudanese Jertiq heritage, family and love." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Mohamed & Laila — Sudanese Jertiq Wedding</title>
    <link rel="stylesheet" href="/src/premium.css" />
    <link rel="stylesheet" href="/src/jertiq-luxury.css" />
    <link rel="stylesheet" href="/src/jertiq-final.css" />
    <link rel="stylesheet" href="/src/jertiq-heritage.css" />
    <link rel="stylesheet" href="/src/soundcloud.css" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function(){
        const track='https://soundcloud.com/girlssongs/adeelah-ya-baidah?si=5285f611b0b34086ad9c44d0cf5ae5af&utm_source=clipboard&utm_medium=text&utm_campaign=social_sharing';
        const embed='https://w.soundcloud.com/player/?url='+encodeURIComponent(track)+'&color=%238e1832&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false';
        function music(){
          if(document.querySelector('.sc-music-shell')) return;
          const shell=document.createElement('div'); shell.className='sc-music-shell'; shell.innerHTML='<button class="sc-music-button" aria-label="Play wedding music">♫</button><span class="sc-music-label">Wedding music</span><a class="sc-music-credit" href="'+track+'" target="_blank" rel="noreferrer">SoundCloud</a><iframe class="sc-music-embed" title="Wedding music" allow="autoplay" src="'+embed+'"></iframe>';
          document.body.appendChild(shell);
          const btn=shell.querySelector('button');
          btn.addEventListener('click',function(){const frame=shell.querySelector('iframe');frame.contentWindow.postMessage(JSON.stringify({method:'toggle'}),'*');const active=btn.classList.toggle('playing');btn.textContent=active?'Ⅱ':'♫';btn.setAttribute('aria-label',active?'Pause wedding music':'Play wedding music');shell.querySelector('.sc-music-label').textContent=active?'Playing':'Wedding music';});
        }
        function reveal(){
          const els=document.querySelectorAll('.j-page main section,.j-page .j-nav');
          els.forEach(function(el,i){el.classList.add('j-reveal');el.style.setProperty('--reveal-delay',Math.min(i,8)*55+'ms');});
          if(!window.__jertiqObserver){window.__jertiqObserver=new IntersectionObserver(function(entries,obs){entries.forEach(function(e){if(e.isIntersecting){e.target.classList.add('is-visible');obs.unobserve(e.target);}})},{threshold:.12});}
          els.forEach(function(el){window.__jertiqObserver.observe(el);});
        }
        music(); reveal();
        new MutationObserver(function(){music();reveal();}).observe(document.body,{childList:true,subtree:true});
      })();
    </script>
    <script type="module" src="/src/entry.jsx"></script>
  </body>
</html>
