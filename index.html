  <body>
    <div id="root"></div>
    <script>
      (function(){
        const track='https://soundcloud.com/girlssongs/adeelah-ya-baidah?si=5285f611b0b34086ad9c44d0cf5ae5af&utm_source=clipboard&utm_medium=text&utm_campaign=social_sharing';
        const embed='https://w.soundcloud.com/player/?url='+encodeURIComponent(track)+'&color=%238e1832&auto_play=true&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false';
        function music(){
          if(document.querySelector('.sc-music-shell'))return;
          const shell=document.createElement('div');shell.className='sc-music-shell';
          shell.innerHTML='<iframe class="sc-music-embed" title="Wedding music" allow="autoplay" src="'+embed+'"></iframe>';
          document.body.appendChild(shell);
          const frame=shell.querySelector('iframe');
          frame.addEventListener('load',function(){try{frame.contentWindow.postMessage(JSON.stringify({method:'play'}),'*')}catch(e){}});
        }
        function enter(){
          const splash=document.querySelector('.j-entry');if(!splash)return;
          document.body.classList.add('j-opened');splash.classList.add('is-leaving');
          setTimeout(function(){splash.remove();},900);
          const frame=document.querySelector('.sc-music-embed');if(frame){try{frame.contentWindow.postMessage(JSON.stringify({method:'play'}),'*')}catch(e){}}
        }
        function entrance(){
          if(document.querySelector('.j-entry'))return;
          const splash=document.createElement('div');splash.className='j-entry';
          splash.innerHTML='<div class="j-entry-glow"></div><div class="j-entry-ornament">✦</div><div class="j-entry-inner"><div class="j-entry-monogram">M <span>&</span> L</div><div class="j-entry-line"></div><p class="j-entry-kicker">A Sudanese Jertiq Celebration</p><h1>Mohamed <span>&</span> Laila</h1><p class="j-entry-ar">محمد وليلي</p><button class="j-entry-button"><span>Open Invitation</span><small>♫ Tap to enter with music</small></button></div></div>';
          document.body.appendChild(splash);splash.addEventListener('click',enter,{once:true});
          splash.querySelector('button').addEventListener('click',function(e){e.stopPropagation();enter();});
        }
        function reveal(){
          const els=document.querySelectorAll('.j-page main section,.j-page .j-nav');
          els.forEach(function(el,i){el.classList.add('j-reveal');el.style.setProperty('--reveal-delay',Math.min(i,8)*55+'ms');});
          if(!window.__jertiqObserver){window.__jertiqObserver=new IntersectionObserver(function(entries,obs){entries.forEach(function(e){if(e.isIntersecting){e.target.classList.add('is-visible');obs.unobserve(e.target);}})},{threshold:.12});}
          els.forEach(function(el){window.__jertiqObserver.observe(el);});
        }
        const ar={'A Sudanese Jertiq Celebration':'احتفال جرتق سوداني أصيل','Open Invitation':'افتح الدعوة','Tap to enter with music':'اضغط للدخول مع الموسيقى','Wedding music':'موسيقى العرس','Playing':'الموسيقى شغالة','WITH LOVE & JOY':'بالمحبة والفرح','Back':'رجوع','Share':'مشاركة','Music':'الموسيقى'};
        function bilingual(){const targets=document.querySelectorAll('.j-page h2,.j-page h3,.j-page p,.j-page button,.j-page .eyebrow,.j-entry p,.j-entry button');targets.forEach(function(el){if(el.querySelector('.j-bilingual-ar'))return;const text=(el.textContent||'').replace(/\s+/g,' ').trim();const arabic=ar[text];if(!arabic)return;const span=document.createElement('span');span.className='j-bilingual-ar';span.lang='ar';span.dir='rtl';span.textContent=arabic;el.appendChild(span);});}
        music();entrance();reveal();bilingual();
        new MutationObserver(function(){music();reveal();bilingual();}).observe(document.body,{childList:true,subtree:true});
      })();
    </script>
    <script type="module" src="/src/entry.jsx"></script>
  </body>
</html>
