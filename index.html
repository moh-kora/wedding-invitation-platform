  <body>
    <div id="root"></div>
    <script>
      (function(){
        const track='https://soundcloud.com/girlssongs/adeelah-ya-baidah?si=5285f611b0b34086ad9c44d0cf5ae5af&utm_source=clipboard&utm_medium=text&utm_campaign=social_sharing';
        const embed='https://w.soundcloud.com/player/?url='+encodeURIComponent(track)+'&color=%238e1832&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false';
        let opened=false;
        function music(){if(document.querySelector('.sc-music-shell'))return;const shell=document.createElement('div');shell.className='sc-music-shell';shell.innerHTML='<button class="sc-music-button" aria-label="Play wedding music">♫</button><span class="sc-music-label">Wedding music</span><a class="sc-music-credit" href="'+track+'" target="_blank" rel="noreferrer">SoundCloud</a><iframe class="sc-music-embed" title="Wedding music" allow="autoplay" src="'+embed+'"></iframe>';document.body.appendChild(shell);const btn=shell.querySelector('button');btn.addEventListener('click',function(){const frame=shell.querySelector('iframe');frame.contentWindow.postMessage(JSON.stringify({method:'toggle'}),'*');const active=btn.classList.toggle('playing');btn.textContent=active?'Ⅱ':'♫';btn.setAttribute('aria-label',active?'Pause wedding music':'Play wedding music');shell.querySelector('.sc-music-label').textContent=active?'Playing':'Wedding music';});}
        function enter(){if(opened)return;opened=true;const splash=document.querySelector('.j-entry');const shell=document.querySelector('.sc-music-shell');const frame=shell&&shell.querySelector('iframe');if(frame)frame.contentWindow.postMessage(JSON.stringify({method:'play'}),'*');document.body.classList.add('j-opened');if(splash){splash.classList.add('is-leaving');setTimeout(function(){splash.remove();},900);}const btn=shell&&shell.querySelector('.sc-music-button');if(btn){btn.classList.add('playing');btn.textContent='Ⅱ';btn.setAttribute('aria-label','Pause wedding music');shell.querySelector('.sc-music-label').textContent='Playing';}}
        function entrance(){if(document.querySelector('.j-entry'))return;const splash=document.createElement('div');splash.className='j-entry';splash.innerHTML='<div class="j-entry-glow"></div><div class="j-entry-ornament">✦</div><div class="j-entry-inner"><div class="j-entry-monogram">M <span>&</span> L</div><div class="j-entry-line"></div><p class="j-entry-kicker">A Sudanese Jertiq Celebration</p><h1>Mohamed <span>&</span> Laila</h1><p class="j-entry-ar">محمد وليلي</p><button class="j-entry-button"><span>Open Invitation</span><small>♫ Tap to enter with music</small></button></div></div>';document.body.appendChild(splash);splash.addEventListener('click',enter,{once:true});splash.querySelector('button').addEventListener('click',function(e){e.stopPropagation();enter();});}
        function reveal(){const els=document.querySelectorAll('.j-page main section,.j-page .j-nav');els.forEach(function(el,i){el.classList.add('j-reveal');el.style.setProperty('--reveal-delay',Math.min(i,8)*55+'ms');});if(!window.__jertiqObserver){window.__jertiqObserver=new IntersectionObserver(function(entries,obs){entries.forEach(function(e){if(e.isIntersecting){e.target.classList.add('is-visible');obs.unobserve(e.target);}})},{threshold:.12});}els.forEach(function(el){window.__jertiqObserver.observe(el);});}
        const ar={'A Sudanese Jertiq Celebration':'احتفال جرتق سوداني أصيل','Open Invitation':'افتح الدعوة','Tap to enter with music':'اضغط للدخول مع الموسيقى','Wedding music':'موسيقى العرس','Playing':'الموسيقى شغالة','WITH LOVE & JOY':'بالمحبة والفرح','We invite you to celebrate the beginning of our forever — with the warmth of Sudanese family, heritage and love.':'بنفرح بيكم معانا ونشارككم بداية عمرنا سوا، وسط دفء الأهل وعبق التراث السوداني والمحبة.','Discover our story ↓':'تعالوا نعيش حكايتنا مع بعض ↓','OUR JERTIQ CELEBRATION':'احتفالنا بالجرتق','A celebration of love, family & Sudanese heritage.':'فرحة حب وأهل وتراث سوداني أصيل.','With our families beside us, we are delighted to invite you to share in this beautiful beginning.':'مع أهلنا الحاضرين معانا، مبسوطين ندعوكم تشاركونا الفرحة والبداية الجميلة دي.','OUR LOVE STORY':'حكايتنا سوا','From one moment to forever.':'من لحظة صغيرة لعمر كامل.','Two hearts met, two families came closer, and a beautiful journey began. Every chapter brought us closer to this day — the day we celebrate love, family and a new beginning.':'قلبين اتلاقوا، وأهلين قربوا من بعض، ومن هنا بدأت حكايتنا الجميلة. كل خطوة قربتنا من اليوم ده، اليوم البنحتفل فيه بالحب والأهل وبداية عمر جديد.','The first meeting':'أول لقاء','The beginning':'البداية','The proposal':'الخطوبة','The wedding':'العرس','A LITTLE SURPRISE':'مفاجأة صغيرة','Scratch to reveal our date':'اكشفوا معانا تاريخ فرحتنا','There is a little secret waiting beneath the gold.':'في سر صغير مخبّي تحت الذهب، خلونا نكتشفو سوا.','SCRATCH ME':'اكشط هنا','Touch, drag or click to uncover':'المس واسحب أو اضغط عشان تكشف المفاجأة','COUNTING THE MOMENTS':'بنعد اللحظات','Our big day is coming soon.':'يوم فرحتنا الكبير قرب.','The countdown will begin as soon as the wedding date is added.':'العد التنازلي ببدأ أول ما نضيف تاريخ العرس.','Until we say “I do.”':'لحدي ما نقول: قبلنا بعض.','Days':'يوم','Hours':'ساعة','Minutes':'دقيقة','Seconds':'ثانية','OUR MOMENTS':'لحظاتنا','A few memories before forever.':'شوية ذكريات قبل العمر الجميل.','View memory':'شوف الذكرى','RSVP RECEIVED':'تم تأكيد الحضور','Thank you,':'شكراً ليك،','Your place is saved. We cannot wait to celebrate with you.':'مكانك محفوظ، ومتحمسين نفرح بيك ونحتفل سوا.','Done':'تم','RSVP':'تأكيد الحضور','Join our celebration':'شاركنا فرحتنا','Guest name':'اسم الضيف','Phone number':'رقم التلفون','Attendance':'الحضور','Yes, I’ll be there':'أيوة، حأكون معاكم','Sorry, I can’t attend':'معليش، ما بقدر أحضر','Number of guests':'عدد الضيوف','Meal preference':'اختيار الأكل','Standard':'عادي','Vegetarian':'نباتي','Vegan':'نباتي بالكامل','Message':'رسالة','Sending…':'جاري الإرسال…','Send RSVP':'أرسل تأكيد الحضور','LEAVE A LITTLE LOVE':'خلّوا لينا كلمة حلوة','Our guestbook':'دفتر التهاني','Share a blessing, a memory or a few words for Mohamed & Laila.':'اكتبوا لينا تهنئة، ذكرى حلوة، أو كم كلمة من القلب لمحمد وليلي.','Your name':'اسمك','Write your message…':'اكتب رسالتك…','Sign the guestbook':'سجّل تهنئتك','Your first message will appear here. ♡':'أول رسالة منكم حتكون هنا. ♡','GOOD TO KNOW':'معلومات مهمة','Frequently asked questions':'الأسئلة الشائعة','What time should guests arrive?':'الضيوف يجوا الساعة كم؟','Where is the wedding?':'العرس وين؟','Is parking available?':'في مواقف للسيارات؟','What is the dress code?':'اللبس المناسب شنو؟','Can I bring an additional guest?':'ممكن أجيب ضيف إضافي؟','What are the wedding events?':'فعاليات العرس شنو؟','Are children welcome?':'الأطفال مرحب بيهم؟','Where can I find accommodation?':'السكن ممكن ألقاه وين؟','Please arrive 20–30 minutes before the ceremony.':'يفضل تجوا قبل الحفل بـ20 إلى 30 دقيقة عشان نبدأ مرتاحين.','See the venue section below for the address and directions.':'شوفوا قسم المكان تحت عشان العنوان وطريقة الوصول.','Parking details will be shared with the final venue information.':'تفاصيل المواقف حنشاركها مع معلومات المكان النهائية.','Sudanese Elegance: traditional Sudanese wear or refined formal evening attire.':'أناقة سودانية: لبس سوداني تقليدي أو لبس رسمي أنيق للمساء.','Please confirm additional guests through the RSVP form.':'أكدوا عدد الضيوف الإضافيين من خلال نموذج الحضور.','Jertiq, Henna Celebration, Wedding Ceremony and Reception.':'الجرتق، ليلة الحنة، عقد/مراسم الزواج، والاستقبال.','Family details will be updated by the couple.':'تفاصيل الأهل حنضيفها قريب مع العروسين.','Recommended accommodation and travel notes will be added by the couple.':'حنضيف قريب اقتراحات السكن وملاحظات السفر.','Invitation unavailable':'الدعوة غير متاحة','This invitation could not be found or is not published yet.':'الدعوة دي ما لقيناها أو لسه ما تم نشرها.','Unable to load invitation.':'حصلت مشكلة في تحميل الدعوة.','Loading your invitation…':'جاري تحميل دعوتكم…','Back':'رجوع','Share':'مشاركة','Music':'الموسيقى'};
        function bilingual(){const targets=document.querySelectorAll('.j-page h2,.j-page h3,.j-page p,.j-page button,.j-page .eyebrow,.j-entry p,.j-entry button');targets.forEach(function(el){if(el.querySelector('.j-bilingual-ar'))return;const text=(el.textContent||'').replace(/\s+/g,' ').trim();const arabic=ar[text];if(!arabic)return;const span=document.createElement('span');span.className='j-bilingual-ar';span.lang='ar';span.dir='rtl';span.textContent=arabic;el.appendChild(span);});}
        music();entrance();reveal();bilingual();
        new MutationObserver(function(){music();reveal();bilingual();}).observe(document.body,{childList:true,subtree:true});
      })();
    </script>
    <script type="module" src="/src/entry.jsx"></script>
